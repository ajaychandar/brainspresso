name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run core module tests
        run: ./gradlew :core:test --stacktrace

      - name: Run app module unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: brainspresso-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish APK to the "latest-debug" release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/*.apk brainspresso-debug.apk
          gh release delete latest-debug --cleanup-tag --yes || true
          gh release create latest-debug brainspresso-debug.apk \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Latest debug build" \
            --notes "Debug build from commit ${{ github.sha }}. Tap brainspresso-debug.apk below to download and install."

      - name: Capture screenshots
        continue-on-error: true
        env:
          CAPTURE_SCREENSHOTS: "1"
        run: ./gradlew :app:testDebugUnitTest --tests "*ScreenshotTest" --stacktrace

      - name: Commit screenshots
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          if ls app/build/screenshots/* >/dev/null 2>&1; then
            mkdir -p docs/screenshots
            cp app/build/screenshots/* docs/screenshots/
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/screenshots
            git commit -m "Update screenshots [skip ci]" || exit 0
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests
            app/build/reports/tests
            app/build/reports/lint-results-debug.html
